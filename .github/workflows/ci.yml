# Quality gate for Game of Life Studio (AR-3 / RFC-008 Decision 9).
#
# Keep the stage order here in LOCKSTEP with the root `ci` script (package.json):
# if they drift, a local-green tree can still fail on the first real push. The
# triggers below are `main` + pull_request only, so a topic branch gets its first
# real run when its PR opens — `npm run ci` locally is the only gate before that.
#
# Stage order (both here and in `npm run ci`):
#   typecheck -> lint -> format:check -> spec:check -> boundary:check -> test:coverage
#     -> build:standalone -> bundle:check -> bench -> bench:check -> e2e (+axe)
#
# Deployment: the `deploy` job publishes `apps/web/out` to GitHub Pages
# (https://game-of-life-studio.com) on `main` pushes only, and only after BOTH
# `quality` and `e2e` are green — the live site never runs ahead of the gate.
# `apps/web/public/CNAME` is what binds the Pages site to the custom domain; the
# export copies it verbatim into `out/`, so it must stay in `public/`.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  # Only cancel in-flight PR runs. Superseding a PR push is free — the branch head
  # is what matters and a newer run covers it. Cancelling an in-flight `main` push
  # is not: it leaves the protected branch with no completed run for that commit.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Explicit least-privilege default; jobs here only read the repo and upload
# artifacts, never write to it. `deploy` widens this at the job level (pages +
# id-token) — never here.
permissions:
  contents: read

jobs:
  # PR gates (RFC-008): typecheck, lint, unit/integration + coverage, build.
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # Turborepo local cache keyed by lockfile + task-relevant source.
      - name: Restore Turborepo cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
            turbo-${{ runner.os }}-

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Spec-ID integrity
        run: npm run spec:check

      - name: Engine boundary (AR-16/AR-40)
        run: npm run boundary:check

      - name: Unit/component tests + coverage
        run: npm run test:coverage

      - name: Build (static export)
        run: npm run build:standalone

      - name: Bundle-size budget
        run: npm run bundle:check

      # ⚠️ Two steps, not one, and in this order (Story 3.7). `bench` MEASURES
      # (turbo, "cache": false — a replayed benchmark is a lie) and `bench:check`
      # GATES the JSON it wrote against the NFR-1.1 frame budget. Splitting them
      # is what makes a failure legible: a red `bench` means the harness broke, a
      # red `bench:check` means the frame got slower. Merging them would also hide
      # the measurement's own exit code behind the gate's. `npm run bench` runs the
      # two workspaces' benches SERIALLY (`--concurrency=1`): the gate sums them,
      # and on a 4-vCPU runner a number taken beside a sibling bench is not a
      # frame.
      - name: Performance benchmark (NFR-1.1)
        run: npm run bench

      - name: Frame budget (AR-43 / NFR-1.1)
        run: npm run bench:check

      # Hand the exact bytes the gates above measured to `deploy`. Skipped on PRs:
      # nothing consumes it there. Kept in THIS job (not rebuilt in `deploy`) so
      # what goes live is byte-identical to what `bundle:check` measured.
      - name: Upload static export for Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/out

  # E2E + a11y (Playwright, 3 browsers + tablet, axe on key screens). Runs after
  # the cheaper gates pass.
  #
  # One job per Playwright project, in parallel. A single job running all four
  # projects with `workers: 2` on a 2-core runner grew with the suite until it hit
  # `timeout-minutes` (936 tests: 11.6–13.3 min of tests plus ~2 min of setup, killed
  # at 15:18 on the first PR merged after #66). Sharding keeps the full cross-browser
  # gate on every PR (WebKit alone caught Story 4.14's aspect-ratio red) and gives
  # each shard the whole budget for a quarter of the work. The threshold stays put:
  # a shard that takes 15 minutes is a real problem, not a suite that outgrew a number.
  e2e:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        project: [chromium, firefox, webkit, tablet]
    env:
      # `tablet` is a WebKit device profile; it needs the WebKit engine installed.
      PLAYWRIGHT_BROWSER: ${{ matrix.project == 'tablet' && 'webkit' || matrix.project }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # Turborepo local cache keyed by lockfile + task-relevant source. Without
      # this the webServer's `build:standalone` rebuilds cold every run instead
      # of hitting the cache the `quality` job just warmed.
      - name: Restore Turborepo cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
            turbo-${{ runner.os }}-

      - run: npm ci

      # Cache the browser BINARIES only. ~/.cache/ms-playwright holds the downloaded
      # browsers; it does not hold the apt system libraries WebKit links against,
      # which `--with-deps` installs into the runner OS and which no cache restores.
      # Keyed per engine as well as per lockfile, so a shard restores only the
      # browser it runs and the four shards never race to write one cache entry.
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ env.PLAYWRIGHT_BROWSER }}-${{ hashFiles('package-lock.json') }}

      # ⚠️ Unconditional, and NOT merged into the step below. These two steps were one
      # `npx playwright install --with-deps` gated on the cache miss, which meant a cache
      # HIT skipped the OS libraries too — so `e2e` was green exactly once per
      # package-lock change and then failed until the next one. WebKit and `tablet`
      # (also WebKit) died with "browserType.launch: Target page, context or browser has
      # been closed" while Chromium and Firefox passed, because WebKit is the engine
      # that needs the system libs. Observed red on Stories 1.7 and 1.8, green only on
      # 1.9 where MUI changed the lockfile and forced a miss.
      - name: Install Playwright system dependencies
        run: npx playwright install-deps ${{ env.PLAYWRIGHT_BROWSER }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install ${{ env.PLAYWRIGHT_BROWSER }}

      # Straight into the `web` workspace so `--project` reaches Playwright rather
      # than Turborepo. The webServer still builds through `npm run build:standalone`,
      # which is the root Turborepo task and hits the cache `quality` warmed.
      - name: E2E + axe (${{ matrix.project }})
        run: npm run e2e --workspace=web -- --project=${{ matrix.project }}

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.project }}
          path: apps/web/playwright-report
          retention-days: 7

  # $0 static deploy to GitHub Pages (custom domain via apps/web/public/CNAME).
  # `main` only, and gated on the full pipeline — a red e2e keeps the previous
  # deployment live. Pages source must be set to "GitHub Actions" in the repo
  # settings for `deploy-pages` to be accepted.
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [quality, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
