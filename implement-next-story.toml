# implement-next-story.toml — project configuration for the implement-next-story skill
# (.claude/skills/implement-next-story, a subtree of sidiar/implement-next-story).
# SKILL.md reads it at the start of every run; lane-gates.py reads every table.

[adapter]
name = "bmad"              # BMad Method v6 — .claude/skills/implement-next-story/adapters/bmad/adapter.md

[models]
# Claude Code model aliases, by role. The skill's Models section has the reasons.
create        = "opus"     # Step 1 and Opening a lane
dev           = "sonnet"   # Step 2 default
dev_escalated = "opus"     # Step 2 when the story is architecture-shaping
sync          = "sonnet"   # Step S

[models.review]            # Step 3: the reviewer for each dev model — never the same
sonnet = "opus"
opus   = "fable"

[adapter]
name = "bmad"               # adapters/bmad/adapter.md, shipped with the skill (written against BMad v6.8.0)

[models]
create        = "opus"     # Step 1 and Opening a lane
dev           = "sonnet"   # Step 2 default
dev_escalated = "opus"     # Step 2 when the story is architecture-shaping
sync          = "sonnet"   # Step S

[models.review]            # Step 3: reviewer per dev model — never the same, never weaker
sonnet = "opus"
opus   = "fable"

[paths]
status_file = "docs/implementation-artifacts/sprint-status.yaml"
stories_dir = "docs/implementation-artifacts"
epics_file  = "docs/planning-artifacts/epics.md"
gates_file  = "docs/implementation-artifacts/lane-gates.yaml"

# Step S — mechanical conflict resolutions a sync subagent may apply without a human.
# sprint-status.yaml (keep both sides) and "anything unlisted → abort" ship with the skill.

[[sync.rules]]
file = "docs/implementation-artifacts/deferred-work.md"
rule = "Keep both hunks, main's first, ours after it. Nothing is ever dropped."

[[sync.rules]]
file = "docs/planning-artifacts/architecture.md"
rule = "Minor Spec Resolutions are numbered sequentially (M1, M2, …): if both sides minted the same M number, ours takes the next free number, and every citation of it in this branch's diff (code and docs) is renumbered."
check = "npm run spec:check"

[[sync.rules]]
file = "docs/project-context.md"
rule = "Keep both additions; if the same rule was added twice, keep main's wording."
